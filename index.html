<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f3f8" media="(prefers-color-scheme: light)">
<title>Lop's Content Tools</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111318'/%3E%3Crect x='12' y='12' width='17' height='17' rx='4' fill='%23f2f2f2'/%3E%3Crect x='35' y='12' width='17' height='17' rx='4' fill='%23f2f2f2'/%3E%3Crect x='12' y='35' width='17' height='17' rx='4' fill='%23f2f2f2'/%3E%3Crect x='35' y='35' width='17' height='17' rx='4' fill='%23f2f2f2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=Unbounded:wght@600&display=swap">
<style>
:root{
  --bg:#f4f3f8; --panel:#ffffff; --ink:#18161f; --muted:#686577; --line:#dddae6; --accent:#5b3df5;
  --f-display:"Unbounded","Familjen Grotesk",system-ui,sans-serif;
  --f-body:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#111318; --panel:#1a1c24; --ink:#eeedf4; --muted:#9d9aae; --line:#2d303b; --accent:#9c88ff}
}
:root[data-theme="dark"]{--bg:#111318; --panel:#1a1c24; --ink:#eeedf4; --muted:#9d9aae; --line:#2d303b; --accent:#9c88ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);padding:calc(40px + env(safe-area-inset-top,0px)) 16px 40px}
main{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
h1{font:600 clamp(28px,5vw,40px)/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.lede{margin:8px 0 0;color:var(--muted);max-width:52ch}
h2{font:600 15px/1.2 var(--f-display);margin:0 0 14px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
a.tile{display:flex;flex-direction:column;gap:10px;color:inherit;text-decoration:none;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:12px;transition:border-color .15s,transform .15s}
a.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
a.tile:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.pic{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--line);display:grid;place-items:center}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .mark{width:100%;height:100%;display:grid;place-items:center;font:600 clamp(28px,6vw,44px)/1 var(--f-display);color:#fff;letter-spacing:-.02em}
.name{font-weight:600;font-size:15px;line-height:1.2}
.tile small{color:var(--muted);font-size:13px}
footer{border-top:1px solid var(--line);padding-top:28px}
.social{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
a.card{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
a.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.card .ico svg{width:24px;height:24px;fill:currentColor}
.card b{display:block;font-size:16px}
.card span{color:var(--muted);font-size:14px}
.fine{color:var(--muted);font-size:13px;margin:24px 0 0}
@media (prefers-reduced-motion:reduce){a.tile,a.card{transition:none}a.tile:hover,a.card:hover{transform:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Lop's <span>Content Tools</span></h1>
    <p class="lede">Free browser tools for fan videos, edits, comics and memes. Everything runs on your device; nothing is uploaded.</p>
  </header>

  <div id="sections"></div>

  <footer>
    <h2>Find me</h2>
    <div id="social" class="social"></div>
    <p class="fine">All of these are non-commercial fan projects. Games and their art belong to their owners.</p>
  </footer>
</main>

<script>
/* ============================================================
   EDIT HERE.
   Each tool is one square. To give a tool your own logo, drop an
   image into the logos/ folder and set "image" to its file name
   (e.g. "logos/hsr-chat.svg"). Any size works; squares look best.
   Until the file exists, the square shows a colored letter mark.
   ============================================================ */
const SECTIONS = [
  {
    title: 'Chat makers',
    tools: [
      { name: 'HSR Chat',    sub: 'Honkai: Star Rail Messages', url: 'https://latieros.github.io/HSR-Chat/',   repo: 'https://github.com/latieros/HSR-Chat',   image: 'logos/hsr-chat.svg',   color: '#c9a84a', mark: 'HSR' },
      { name: 'ZZZ Chat',    sub: 'Zenless Zone Zero Knock Knock', url: 'https://latieros.github.io/ZZZ-Chat/', repo: 'https://github.com/latieros/ZZZ-Chat',   image: 'logos/zzz-chat.svg',   color: '#2e2e2e', mark: 'ZZZ' },
      { name: 'Nikke Chat',  sub: 'Goddess of Victory: Nikke',  url: 'https://latieros.github.io/Nikke-Chat/', repo: 'https://github.com/latieros/Nikke-Chat', image: 'logos/nikke-chat.svg', color: '#3b78d8', mark: 'NK' },
      { name: 'MomoTalk IM', sub: 'Blue Archive MomoTalk',    url: 'https://latieros.github.io/MomoTalk-IM/', repo: 'https://github.com/latieros/MomoTalk-IM', image: 'logos/momotalk-im.svg', color: '#ff8fa4', mark: 'MT' },
      { name: 'Persona IM',  sub: 'Persona 5 chat',             url: 'https://latieros.github.io/P5-test2/',   repo: 'https://github.com/latieros/P5-test2',   image: 'logos/persona-im.svg', color: '#d62828', mark: 'P5' },
      { name: 'Chat Reel',   sub: 'iPhone, Android, WhatsApp, Discord…', url: 'https://latieros.github.io/Photo-Tools-Personal/chat-reel.html', repo: 'https://github.com/latieros/Photo-Tools-Personal', image: 'logos/chat-reel.png', color: '#2ca58d', mark: 'CR' },
    ],
  },
  {
    title: 'Story makers',
    tools: [
      { name: 'GBF Story Maker', sub: 'Granblue Fantasy cutscenes', url: 'https://latieros.github.io/GBF-Story-Maker/', repo: 'https://github.com/latieros/GBF-Story-Maker', image: 'logos/gbf-story-maker.svg', color: '#1f6fb2', mark: 'GBF' },
      { name: 'Visual Novel',    sub: 'Branching scenes and choices', url: 'https://latieros.github.io/Photo-Tools-Personal/visual-novel.html', repo: 'https://github.com/latieros/Photo-Tools-Personal', image: 'logos/visual-novel.png', color: '#8e44ad', mark: 'VN' },
      { name: 'Motion Comic',    sub: 'Panels, bubbles, page turns', url: 'https://latieros.github.io/Photo-Tools-Personal/motion-comic.html', repo: 'https://github.com/latieros/Photo-Tools-Personal', image: 'logos/motion-comic.png', color: '#e67e22', mark: 'MC' },
      { name: 'Delivery Reel',   sub: 'A made-up delivery order', url: 'https://latieros.github.io/Photo-Tools-Personal/delivery-reel.html', repo: 'https://github.com/latieros/Photo-Tools-Personal', image: 'logos/delivery-reel.png', color: '#27ae60', mark: 'DR' },
    ],
  },
  {
    title: 'Photo & video tools',
    tools: [
      { name: 'Photo Frame Studio', sub: 'Posts, phone screens, prints, covers', url: 'https://latieros.github.io/Photo-Tools-Personal/photo-frame-studio.html', repo: 'https://github.com/latieros/Photo-Tools-Personal', image: 'logos/photo-frame-studio.png', color: '#5b3df5', mark: 'PF' },
      { name: 'Photo Splitter',     sub: 'Cut one photo into a swipe post', url: 'https://latieros.github.io/Photo-Tools-Personal/photo-splitter.html', repo: 'https://github.com/latieros/Photo-Tools-Personal', image: 'logos/photo-splitter.png', color: '#16a085', mark: 'PS' },
      { name: 'Video Layers',       sub: 'Layer pictures, video, text, music', url: 'https://latieros.github.io/Photo-Tools-Personal/video-layers.html', repo: 'https://github.com/latieros/Photo-Tools-Personal', image: 'logos/video-layers.png', color: '#c0392b', mark: 'VL' },
      { name: 'Metadata Scrubber',  sub: 'Strip hidden data from files', url: 'https://latieros.github.io/Photo-Tools-Personal/metadata-scrubber.html', repo: 'https://github.com/latieros/Photo-Tools-Personal', image: 'logos/metadata-scrubber.png', color: '#34495e', mark: 'MS' },
    ],
  },
];

/* Your links. Replace the placeholders with your real handles / invite. */
const SOCIAL = [
  { name: 'Ko-fi',   sub: 'Buy me a coffee',     url: 'https://ko-fi.com/latieros', color: '#ff5e5b',
    icon: '<svg viewBox="0 0 24 24"><path d="M4 5h13a4 4 0 0 1 0 8h-1v1a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V5zm12 2v4h1a2 2 0 0 0 0-4h-1zm-7 1.5c-.9 0-1.6.7-1.6 1.6 0 1.6 2.6 3.2 2.6 3.2s2.6-1.6 2.6-3.2c0-.9-.7-1.6-1.6-1.6-.4 0-.8.2-1 .5-.2-.3-.6-.5-1-.5z"/></svg>' },
  { name: 'Twitter / X', sub: 'Updates and new tools', url: 'https://x.com/latieros', color: '#1d1d1f',
    icon: '<svg viewBox="0 0 24 24"><path d="M17.5 3h3l-7 8 8 10h-6.2l-4.9-6.3L4.8 21h-3l7.5-8.6L1.6 3h6.4l4.4 5.8L17.5 3zm-1 16h1.7L7.6 4.8H5.8L16.5 19z"/></svg>' },
  { name: 'Discord', sub: 'Come say hi',         url: 'https://discord.gg/YOUR-INVITE', color: '#5865f2',
    icon: '<svg viewBox="0 0 24 24"><path d="M19.6 5.3A17 17 0 0 0 15.4 4l-.2.4a15 15 0 0 1 3.9 1.9 13 13 0 0 0-14.2 0A15 15 0 0 1 8.8 4.4L8.6 4a17 17 0 0 0-4.2 1.3C1.8 9.2 1.1 13 1.4 16.7a17 17 0 0 0 5.2 2.6l1.1-1.8a11 11 0 0 1-1.8-.9l.4-.3a12 12 0 0 0 11.4 0l.4.3-1.8.9 1.1 1.8a17 17 0 0 0 5.2-2.6c.4-4.3-.7-8-3-11.4zM8.7 14.4c-1 0-1.9-1-1.9-2.1s.8-2.1 1.9-2.1 1.9 1 1.9 2.1-.8 2.1-1.9 2.1zm6.6 0c-1 0-1.9-1-1.9-2.1s.8-2.1 1.9-2.1 1.9 1 1.9 2.1-.8 2.1-1.9 2.1z"/></svg>' },
];

/* ---- No need to edit below this line ---- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tile(t){
  const mark = `<div class="mark" style="background:${esc(t.color || '#555')}">${esc(t.mark || t.name[0])}</div>`;
  const pic = t.image ? `<img src="${esc(t.image)}" alt="" loading="lazy">` : mark;
  return `<a class="tile" href="${esc(t.url)}" data-mark="${esc(t.mark || t.name[0])}" data-color="${esc(t.color || '#555')}">
    <div class="pic">${pic}</div>
    <span class="name">${esc(t.name)}</span>
    ${t.sub ? `<small>${esc(t.sub)}</small>` : ''}
  </a>`;
}
document.getElementById('sections').innerHTML = SECTIONS.map(s => `
  <section>
    <h2>${esc(s.title)}</h2>
    <div class="grid">${s.tools.map(tile).join('')}</div>
  </section>`).join('<div style="height:36px"></div>');

// A missing logo file falls back to the letter mark instead of a broken image.
document.querySelectorAll('.pic img').forEach(img => {
  img.addEventListener('error', () => {
    const a = img.closest('.tile');
    img.parentElement.innerHTML = `<div class="mark" style="background:${esc(a.dataset.color)}">${esc(a.dataset.mark)}</div>`;
  });
});

document.getElementById('social').innerHTML = SOCIAL.map(s => `
  <a class="card" href="${esc(s.url)}" target="_blank" rel="noopener">
    <span class="ico" style="background:${esc(s.color)}">${s.icon}</span>
    <span><b>${esc(s.name)}</b><span>${esc(s.sub)}</span></span>
  </a>`).join('');
</script>
</body>
</html>
